name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:admin
      - run: node --test tests/ci-startup.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Authenticate container downloads
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Supabase images
        id: supabase-images
        uses: actions/cache@v4
        with:
          path: ~/.cache/rastligan/supabase-images.tar.gz
          key: supabase-2.122.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('supabase/config.toml') }}
      - name: Restore cached images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: gzip -dc ~/.cache/rastligan/supabase-images.tar.gz | docker load
      - name: Start isolated local Supabase
        run: node scripts/start-ci-supabase.mjs
      - name: Save downloaded images for future runs
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/rastligan
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | awk '/^(public\.ecr\.aws\/supabase\/|ghcr\.io\/supabase\/|supabase\/)/ && !/:<none>$/')
          test "${#images[@]}" -gt 0
          docker save "${images[@]}" | gzip -1 > ~/.cache/rastligan/supabase-images.tar.gz
      - run: npm run local:configure
      - run: npm run test:db
      - name: Serve actual Edge Function
        run: |
          supabase functions serve editor --env-file supabase/.env.local > /tmp/rastligan-edge.log 2>&1 &
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"action":"session"}' http://127.0.0.1:55431/functions/v1/editor || true)
            if [ "$status" = "401" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/rastligan-edge.log
          exit 1
      - run: npm run test:prepare
      - run: npm run test:security
      - name: Import verified original source into isolated database
        run: npm run import -- --file data/source-google-sheets.json --apply --report data/ci-import-report.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Verify no secrets in static assets
        run: node --env-file=.env.local --env-file=.env.test.local scripts/check-build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            artifacts/screenshots/
            playwright-report/
          retention-days: 14
